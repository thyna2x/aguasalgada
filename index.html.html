<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Luna</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Quicksand', sans-serif;
    background:black;
}


#tela1{
    height:100vh;
    overflow:hidden;
    background: radial-gradient(circle at bottom, #020111 0%, #000000 80%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    text-align:center;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    animation:piscar 2s infinite alternate;
}

@keyframes piscar{
    from{opacity:0.2;}
    to{opacity:1;}
}

.botao{
    margin-top:25px;
    padding:16px 32px;
    border:none;
    border-radius:40px;
    background:#22c55e;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
    letter-spacing:1px;
}

.botao:hover{
    transform:scale(1.1);
    background:#16a34a;
}


#tela2{
    min-height:100vh;
    background:#000;
    color:white;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
}

img{
    width:240px;
    max-width:80%;
    border-radius:25px;
    box-shadow:0 0 35px #ff4da6;
    margin-bottom:25px;
    animation:foto 1.5s ease;
}

@keyframes foto{
    from{opacity:0; transform:scale(.8);}
    to{opacity:1; transform:scale(1);}
}

.texto{
    max-width:650px;
    line-height:1.8;
    font-size:18px;
    letter-spacing:1.4px;
    margin-bottom:20px;
    animation:aparecer 2s ease;
}

@keyframes aparecer{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.frase{
    margin-top:10px;
    font-weight:600;
    font-size:22px;
    color:#ff4da6;
}


.spotify{
    margin-top:25px;
    padding:14px 28px;
    border:none;
    border-radius:40px;
    background:#1DB954;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
    letter-spacing:1px;
}

.spotify:hover{
    transform:scale(1.1);
    background:#17a74a;
}
</style>
</head>
<body>


<div id="tela1">
    <h1>Oi amor</h1>
    <p>Clique abaixo e sinta o que eu sinto por você</p>
    <button class="botao" onclick="mostrarTela2()">💚 Clique e descubra</button>
</div>


<div id="tela2">

<img src="https://i.pinimg.com/1200x/e0/fb/95/e0fb95531ab887787d2a8fd7209ad2b6.jpg">

<div class="texto">
Nem sei explicar, mas depois que você chegou, tudo em mim mudou.<br><br>

Parece que minha alma já te conhecia antes mesmo de eu entender o que sentia.<br><br>

Você não é só especial, você é quem mudou minha forma de ver o mundo.<br><br>

</div>

<div class="frase">
Eu te amo, luna
</div>

<a href="https://open.spotify.com/intl-pt/track/7jh32X9JYZ4WX1DLdVDK7f?si=3e56ec4737e6462b" target="_blank">
<button class="spotify">Clique e escute a trilha da minha alma quando penso em você</button>
</a>

</div>

<script>

for(let i=0;i<140;i++){
    let star=document.createElement("div");
    star.className="star";
    star.style.top=Math.random()*100+"%";
    star.style.left=Math.random()*100+"%";
    star.style.animationDuration=(Math.random()*3+1)+"s";
    document.body.appendChild(star);
}


function mostrarTela2(){
    document.getElementById("tela1").style.display="none";
    document.getElementById("tela2").style.display="flex";
    window.scrollTo({top:0, behavior:"smooth"});
}
</script>

</body>
</html>
